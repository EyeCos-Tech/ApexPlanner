
# ===================================================================
# CONFIGURACI\u00d3N SPRING BOOT
# ===================================================================
# ===================================================================
# CONFIGURACI\u00d3N DEL SERVIDOR
# ===================================================================
# Puerto donde se ejecuta la aplicaci\u00f3n
server.port=8080
# Ruta base de la aplicaci\u00f3n
server.servlet.context-path=/
# Tiempo m\u00e1ximo de sesi\u00f3n (en segundos)
server.servlet.session.timeout=1800
# Configuraci\u00f3n de compresi\u00f3n
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json
server.compression.min-response-size=1024
# ===================================================================
# INFORMACI\u00d3N DE LA APLICACI\u00d3N
# ===================================================================
# Nombre de la aplicaci\u00f3n
spring.application.name=Apexplanner
# Informaci\u00f3n personalizada
info.app.name=Apexplanner
info.app.description=Apexplanner
info.app.version=1.0.0
info.app.author=Pau
info.app.curso=Eyecos
# ===================================================================
# CONFIGURACI\u00d3N DE LOGGING
# ===================================================================
# Nivel de logging para nuestra aplicaci\u00f3n
logging.level.com.dam.ejemplo=INFO
# Nivel de logging para Spring Framework
logging.level.org.springframework=WARN
# Patr\u00f3n de formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n# 
#==================================================================
# CONFIGURACI\u00d3N DE DESARROLLO
# ===================================================================
# Activar DevTools para reinicio autom\u00e1tico
spring.devtools.restart.enabled=true
# Activar LiveReload
spring.devtools.livereload.enabled=true
# ===================================================================
# CONFIGURACI\u00d3N DE JACKSON (JSON)
# ===================================================================
# Formato de fechas en JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# Zona horaria para fechas
spring.jackson.time-zone=Europe/Madrid
# Indentaci\u00f3n bonita del JSON (desarrollo)
spring.jackson.serialization.indent-output=true
# ===================================================================
# CONFIGURACI\u00d3N PERSONALIZADA
# ===================================================================
# Configuraci\u00f3n de la aplicaci\u00f3n
app.nombre-completo= Apexplanner
app.version=1.0.0
app.autor=Pau
app.max-usuarios=100
app.timeout-sesion=30
#java.awt.headless=true
# Configuraci\u00f3n de negocio
negocio.iva-porcentaje=21.0
negocio.descuento-estudiante=10.0
negocio.moneda-por-defecto=EUR


# ===================================================================
# CONFIGURACI\u00d3N REACT
# ===================================================================
# Configuraci\u00f3n de la base de datos H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Configuraci\u00f3n JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Habilitar consola H2 (solo para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Configuraci\u00f3n CORS
management.endpoints.web.cors.allowed-origins=http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS